<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Mahasiswa</title>
  <meta name="description"
    content="Dashboard mahasiswa: peminjaman berikutnya, ruang yang kosong sekarang, serta status dan riwayat pengajuan. Data contoh.">
  <link
    href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Navigasi"></aside>
    <main class="main" id="isi">
      <header class="top">
        <div class="top__l">
          <button class="btn btn--icon menu-btn" type="button" id="menu-btn" aria-label="Buka menu"
            aria-expanded="false"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg></button>
          <div>
            <h1>Dashboard</h1>
            <p>Status pengajuan dan riwayat peminjamanmu.</p>
          </div>
        </div>
        <a class="btn btn--primary" href="mahasiswa-pengajuan.html">Ajukan Peminjaman</a>
      </header>

      <div class="stats" id="stats"></div>

      <div class="cols">
        <section class="well panel" aria-labelledby="next-h">
          <div class="panel__head">
            <h2 id="next-h">Peminjaman berikutnya</h2><a href="mahasiswa-ketersediaan.html">Lihat kalender</a>
          </div>
          <div id="next"></div>
        </section>
        <section class="well panel" aria-labelledby="now-h">
          <div class="panel__head">
            <h2 id="now-h">Ruang kosong</h2><span class="note" id="now-when"></span>
          </div>
          <ul class="list" id="now"></ul>
        </section>
      </div>

      <section class="well panel" id="riwayat" aria-labelledby="riw-h" style="margin-top: var(--space-md)">
        <div class="panel__head">
          <h2 id="riw-h">Status dan riwayat</h2>
        </div>
        <div class="toolbar">
          <fieldset class="seg" id="filter">
            <legend class="visually-hidden">Filter status</legend>
            <input type="radio" name="f" id="f-semua" value="semua" checked><label for="f-semua">Semua</label>
            <input type="radio" name="f" id="f-aktif" value="aktif"><label for="f-aktif">Aktif</label>
            <input type="radio" name="f" id="f-selesai" value="selesai"><label for="f-selesai">Selesai</label>
            <input type="radio" name="f" id="f-lain" value="lain"><label for="f-lain">Ditolak atau batal</label>
          </fieldset>
        </div>
        <div class="tablewrap" tabindex="0" role="region"
          aria-label="Tabel riwayat, geser ke samping bila layar sempit">
          <table>
            <thead>
              <tr>
                <th>Ruang</th>
                <th>Waktu</th>
                <th>Keperluan</th>
                <th>Status</th>
                <th class="act"><span class="visually-hidden">Aksi</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <p class="note" id="kabar" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="shell.js"></script>
  <script>
    (() => {
      'use strict';
      PKshell('mahasiswa');
      const { fm, esc, parseISO, iso, addDays, DAYS, ROOMS, MIN0, MIN1 } = PK;
      const $ = (s) => document.querySelector(s);
      const mine = () => PK.store.bookings.filter((b) => b.by === PK.ME);
      const after = (b) => b.date > PK.todayISO || (b.date === PK.todayISO && b.e > new Date().getHours() * 60 + new Date().getMinutes());
      const ACTIVE = ['diajukan', 'disetujui', 'berjalan'];

      function stats() {
        const m = mine();
        const n = (f) => m.filter(f).length;
        $('#stats').innerHTML = [
          ['Menunggu persetujuan', n((b) => b.status === 'diajukan'), ''],
          ['Disetujui, belum dipakai', n((b) => b.status === 'disetujui' && after(b)), 'stat--open'],
          ['Selesai', n((b) => b.status === 'selesai'), ''],
          ['Terlambat dikembalikan', n((b) => b.status === 'terlambat'), '']
        ].map(([l, v, c]) => `<div class="well stat ${c}"><b>${v}</b><span>${l}</span></div>`).join('');
      }
      function next() {
        const list = mine().filter((b) => ['disetujui', 'berjalan'].includes(b.status) && after(b)).sort((a, b) => (a.date + a.s).localeCompare(b.date + b.s));
        const b = list[0];
        $('#next').innerHTML = b
          ? `<p class="stat" style="padding:0"><b style="font-size:var(--text-3xl)">${esc(PK.roomOf(b.room).name)}</b></p><p style="margin-top:var(--space-xs)"><strong style="color:var(--color-ink)">${esc(b.title)}</strong></p><p class="num" style="margin-top:var(--space-2xs)">${esc(PK.when(b))}</p><p style="margin-top:var(--space-sm)">${PK.tag(b.status)}</p>`
          : `<div class="empty"><p>Belum ada peminjaman yang disetujui.</p><a class="btn" href="mahasiswa-pengajuan.html">Ajukan Peminjaman</a></div>`;
      }
      function now() {
        const n = new Date(); let d = new Date(n.getFullYear(), n.getMonth(), n.getDate()), m = n.getHours() * 60 + n.getMinutes(), lab = 'Pukul ' + fm(m);
        let dow = PK.dowOf(d);
        if (dow === 6 || m >= MIN1) { do { d = addDays(d, 1); dow = PK.dowOf(d); } while (dow === 6); m = MIN0; lab = DAYS[dow] + ' ' + fm(MIN0); }
        else if (m < MIN0) { m = MIN0; lab = 'Buka ' + fm(MIN0); }
        $('#now-when').textContent = lab;
        $('#now').innerHTML = ROOMS.map((r) => {
          const its = PK.itemsFor(r.id, iso(d), dow, false), cur = its.find((i) => m >= i.s && m < i.e);
          const txt = cur ? `<span class="tag tag--out">${cur.kind === 'kuliah' ? 'Kuliah' : 'Dipinjam'} sampai ${fm(cur.e)}</span>` : `<span class="tag tag--in">Kosong sampai ${fm((its.find((i) => i.s > m) || { s: MIN1 }).s)}</span>`;
          return `<li><b>${esc(r.name)}</b>${txt}</li>`;
        }).join('');
      }
      let filter = new URLSearchParams(location.search).get('status') || 'semua';
      function rows() {
        const f = { semua: () => true, aktif: (b) => ACTIVE.includes(b.status), selesai: (b) => b.status === 'selesai', lain: (b) => ['ditolak', 'dibatalkan', 'terlambat'].includes(b.status) }[filter] || (() => true);
        const list = mine().filter(f).sort((a, b) => (b.date + b.s).localeCompare(a.date + a.s));
        $('#rows').innerHTML = list.length ? list.map((b) => `<tr><td><b>${esc(PK.roomOf(b.room).name)}</b></td><td class="num">${esc(PK.when(b))}</td><td>${esc(b.title)}</td><td>${PK.tag(b.status)}</td><td class="act">${['diajukan', 'disetujui'].includes(b.status) && after(b) ? `<button class="btn btn--sm" type="button" data-cancel="${b.id}">Batalkan</button>` : ''}</td></tr>`).join('')
          : `<tr><td colspan="5"><div class="empty"><p>Tidak ada pengajuan di filter ini.</p><a class="btn" href="mahasiswa-pengajuan.html">Ajukan Peminjaman</a></div></td></tr>`;
      }
      const all = () => { stats(); next(); now(); rows(); window.PKnavCount && PKnavCount(); };
      document.getElementById('f-' + (filter === 'lain' ? 'lain' : filter)) && (document.getElementById('f-' + filter).checked = true);
      $('#filter').addEventListener('change', (e) => { filter = e.target.value; history.replaceState(null, '', '?status=' + filter + location.hash); rows(); });
      $('#rows').addEventListener('click', (e) => {
        const b = e.target.closest('[data-cancel]'); if (!b) return;
        const bk = PK.store.bookings.find((x) => x.id === b.dataset.cancel);
        if (!bk || !confirm('Batalkan peminjaman ' + PK.roomOf(bk.room).name + ' pada ' + PK.when(bk) + '?')) return;
        bk.status = 'dibatalkan'; PK.save(); all();
        $('#kabar').textContent = 'Peminjaman ' + PK.roomOf(bk.room).name + ' dibatalkan. Jamnya kembali kosong di kalender.';
      });
      all();
    })();
  </script>
</body>

</html>
